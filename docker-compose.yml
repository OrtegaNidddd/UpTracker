services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uptracker_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
      - "${REVERB_PORT:-8080}:8080"
    environment:
      APP_NAME: "${APP_NAME:-UpTracker}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY:-base64:75wGk6VfQ975g7L1hX/8oRkOuhkY99m6xQ8N+1Ym4yA=}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:8000}"
      DB_CONNECTION: "${DB_CONNECTION:-sqlite}"
      DB_DATABASE: "/var/www/html/database/database.sqlite"
      BROADCAST_CONNECTION: "reverb"
      QUEUE_CONNECTION: "database"
      SESSION_DRIVER: "database"
      CACHE_STORE: "database"
      REVERB_APP_ID: "${REVERB_APP_ID:-100001}"
      REVERB_APP_KEY: "${REVERB_APP_KEY:-uptracker_reverb_key}"
      REVERB_APP_SECRET: "${REVERB_APP_SECRET:-uptracker_reverb_secret}"
      REVERB_HOST: "${REVERB_HOST:-127.0.0.1}"
      REVERB_PORT: 8080
      REVERB_SCHEME: "http"
      RUN_MIGRATIONS: "true"
    volumes:
      - uptracker_data:/var/www/html/database
      - uptracker_storage:/var/www/html/storage

volumes:
  uptracker_data:
  uptracker_storage:
